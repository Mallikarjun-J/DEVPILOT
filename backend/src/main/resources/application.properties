# ==========================================
# DevPilot Backend Configuration
# ==========================================
spring.application.name=backend
server.port=${PORT:8081}
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Import local development overrides if present
spring.config.import=optional:classpath:application-local.properties

# ------------------------------------------
# Database: Neon Serverless PostgreSQL
# ------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-lingering-bird-b5zb02a0-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings optimized for Neon Serverless
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------
# Spring AI: Google Gemini (Chat & Embeddings)
# ------------------------------------------
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.project-id=${GEMINI_PROJECT_ID:devpilot}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.options.model=gemini-embedding-2.0
spring.ai.google.genai.embedding.text.model=gemini-embedding-2.0
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.options.dimensions=768

# Vector Store: PGVector (Gemini embeddings have 768 dimensions)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# ------------------------------------------
# Security: GitHub OAuth2
# ------------------------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo

# ------------------------------------------
# Application Custom Settings
# ------------------------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${ENCRYPTION_PASSWORD:devpilot-change-me-secret-token-key}
app.token-encryptor-salt=${ENCRYPTION_SALT:5c0744940b5c369b}
app.indexing.max-file-bytes=61440
app.indexing.chunk-size=2400
